# The srcla strategy service's own Postgres: the `srcla` database on :5433
# (Prisma 5 schema in prisma/schema.prisma).
services:
  postgres:
    image: postgres:16-alpine
    container_name: srcla-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: srcla
    ports:
      - '5433:5432'
    volumes:
      - srcla-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U user -d srcla']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  srcla-pgdata:
