[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.24"
optimizer = true
optimizer_runs = 10000
via_ir = true
fs_permissions = [{ access = "read", path = "./"}]
evm_version = "cancun"

# Enable bytecode size limit bypass for Anvil
[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 128

[fmt]
line_length = 120

[rpc_endpoints]
base = "${BASE_RPC_URL}"

[etherscan]
base = { key = "${ETHERSCAN_API_KEY}" }
